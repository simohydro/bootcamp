<!-- Pagina FieldKit.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Field Tools - Environmental Hydrogeology Research Group</title>
    <meta name="description" content="Strumentazione e attrezzature da campo utilizzate dal Gruppo di Ricerca di Idrogeologia Ambientale.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">

    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <section id="fieldkit" class="my-5 pt-5"> 
        <div class="container">
            <h1 class="text-center mb-5 display-4">
                <i class="bi bi-tools me-3"></i>FieldKit
            </h1>

               <!-- Filtri Categorie - Versione corretta -->
            <div class="row mb-4 g-3 justify-content-center" id="filter-buttons">
                <div class="col-auto">
                    <button class="btn btn-outline-primary active" data-category="all">
                        Tutti
                    </button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary" data-category="acquisizione">
                        Acquisizione Dati
                    </button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary" data-category="laboratorio">
                        Analisi Laboratorio
                    </button>
                </div>
            </div>

            <!-- Grid Strumenti (generata da fieldkit.json) -->
            <div class="row g-4" id="strumenti-container">
                <p class="text-center text-muted">Caricamento strumenti...</p>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/include.js"></script>
    <script src="assets/js/fieldkit.js"></script>
</body>
</html>
