<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutti i progetti - Idrogeologia Ambientale</title>
    <meta name="description" content="Progetti di ricerca attivi e conclusi del Gruppo di Ricerca di Idrogeologia Ambientale, Università di Milano-Bicocca.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">


    <!-- Bootstrap & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <main class="container py-5 mt-5">
        <h1 class="text-center mb-5" id="dynamicTitle">Progetti di Ricerca</h1>

        <!-- Filtri -->
        <div class="row mb-4">
            <div class="col text-center">
                <div class="btn-group">
                    <a href="?filter=tutti" class="btn btn-outline-primary filter-btn active" data-filter="tutti">Tutti</a>
                    <a href="?filter=attivi" class="btn btn-outline-primary filter-btn" data-filter="attivi">Attivi</a>
                    <a href="?filter=conclusi" class="btn btn-outline-primary filter-btn" data-filter="conclusi">Conclusi</a>
                </div>
            </div>
        </div>

        <!-- Griglia progetti, generata da progetti.json -->
        <div class="row g-4" id="progetti-container">
            <p class="text-center text-muted">Caricamento progetti...</p>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/include.js"></script>
    <script src="assets/js/progetti.js"></script>
</body>
</html>
