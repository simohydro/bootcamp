<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutte le Pubblicazioni - Idrogeologia Ambientale</title>
    <meta name="description" content="Elenco completo delle pubblicazioni scientifiche del Gruppo di Ricerca di Idrogeologia Ambientale, Università degli Studi di Milano-Bicocca.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container" style="margin-top: 120px; margin-bottom: 60px;">
        <h1 class="text-center mb-5">Tutte le Pubblicazioni</h1>

        <div class="row mb-4 g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <label class="input-group-text" for="yearFilter">Anno</label>
                    <select class="form-select" id="yearFilter">
                        <option value="all">Tutte</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="keywordFilter" placeholder="Cerca per keyword o titolo...">
                    <button class="btn btn-outline-secondary" type="button" id="searchButton">Cerca</button>
                </div>
            </div>
        </div>

        <div class="row g-4" id="publications-list">
            <p class="text-center text-muted">Caricamento pubblicazioni...</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/include.js"></script>
    <script src="assets/js/pubblicazioni.js"></script>
</body>
</html>
